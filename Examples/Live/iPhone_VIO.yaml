%YAML:1.0

File.version: "1.0"

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

Camera1.fx: 877.391499
Camera1.fy: 876.436857
Camera1.cx: 640.678499
Camera1.cy: 361.943842

# Kalibr radtan distortion: [k1, k2, p1, p2]
Camera1.k1: 0.116203563
Camera1.k2: -0.268827617
Camera1.p1: -0.000848992
Camera1.p2: 0.000979690

Camera.width: 1280
Camera.height: 720
Camera.fps: 30
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters
#--------------------------------------------------------------------------------------------
# ORB-SLAM3 expects T_b_c1: camera-1 frame -> body/IMU frame.
# This is the inverse of Kalibr's T_cam_imu from the 15 Hz calibration.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.003649240, -0.999975083,  0.006042804,  0.043849052,
          -0.999973900,  0.003611421, -0.006257601,  0.048084519,
           0.006235622, -0.006065482, -0.999962163, -0.017700598,
           0.0,          0.0,          0.0,          1.0]

IMU.NoiseGyro: 8.2e-05
IMU.NoiseAcc: 8.0e-04
IMU.GyroWalk: 1.0e-05
IMU.AccWalk: 1.0e-03
IMU.Frequency: 100.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
